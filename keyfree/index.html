
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Returning to DIVJOTEDU</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #0f172a;
      font-family: system-ui, sans-serif;
    }
    .card {
      text-align: center;
      background: white;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 10px 35px #0f172a12;
    }
    .loader {
      width: 28px;
      height: 28px;
      margin: 18px auto;
      border: 3px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #2563eb; }
  </style>

  <script>
    (() => {
      // This records a landing-page visit, not verified ad completion.
      try {
        const duration = 24 * 60 * 60 * 1000;
        localStorage.setItem(
          "divjotedu_access_expiry",
          String(Date.now() + duration)
        );
      } catch (error) {}

      // Return to the main website.
      window.location.replace("../?unlocked=1");
    })();
  </script>
</head>

<body>
  <main class="card">
    <h2>Returning to DIVJOTEDU</h2>
    <div class="loader"></div>
    <p>If you are not redirected, <a href="../?unlocked=1">Continue here</a>.</p>
  </main>
</body>
</html>
