
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIVJOTEDU – Modern Educational Platform</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: flex;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- HEADER -->
    <header class="w-full py-4 px-6 md:px-12 bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="goToWelcome()">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center text-white justify-center font-bold text-xl shadow-lg shadow-blue-500/20">
                D
            </div>
            <span class="text-xl font-bold tracking-tight text-slate-900">DIVJOTEDU</span>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex items-center justify-center p-4 md:p-8">

        <!-- WELCOME SCREEN -->
        <div id="welcome-screen" class="screen active flex-col items-center text-center max-w-xl mx-auto py-12">
            <div class="w-20 h-20 rounded-3xl bg-blue-50 flex items-center justify-center text-blue-600 mb-6 shadow-sm border border-blue-100/60">
                <i class="fa-solid fa-graduation-cap text-3xl"></i>
            </div>

            <h1 class="text-3xl md:text-5xl font-bold tracking-tight text-slate-900 mb-4">
                Welcome to <span class="text-blue-600">DIVJOTEDU</span>
            </h1>

            <p class="text-slate-500 text-base md:text-lg mb-8 leading-relaxed">
                Your premium, modern platform to access Next Toppers batches seamlessly.
            </p>

            <button onclick="handleStartStudying()" class="px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-2xl shadow-xl shadow-blue-600/20 transition-all flex items-center space-x-3 text-lg">
                <span>START STUDYING</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>
        </div>

        <!-- PLATFORM SELECTION SCREEN -->
        <div id="platform-screen" class="screen flex-col items-center w-full max-w-4xl mx-auto py-6">

            <div class="w-full text-left mb-6">
                <button onclick="goToWelcome()" class="text-sm font-semibold text-slate-500 hover:text-slate-800 transition-all flex items-center space-x-2 mb-2">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Welcome</span>
                </button>

                <h2 class="text-2xl md:text-3xl font-bold text-slate-900">
                    Select Learning Platform
                </h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">

                <!-- NEXT TOPPERS CARD -->
                <div onclick="openNextToppers()" class="glass-card p-6 rounded-3xl shadow-sm hover:shadow-xl transition-all cursor-pointer border border-slate-200/80 group relative overflow-hidden flex flex-col justify-between">

                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-14 h-14 rounded-2xl bg-blue-600 text-white flex items-center justify-center font-bold text-2xl shadow-md">
                                NT
                            </div>

                            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-blue-50 text-blue-600 border border-blue-100">
                                Active
                            </span>
                        </div>

                        <h3 class="text-xl font-bold text-slate-900 mb-2">
                            Next Toppers
                        </h3>

                        <p class="text-slate-500 text-sm leading-relaxed mb-6">
                            Access all Next Toppers batches and study materials securely.
                        </p>
                    </div>

                    <div class="flex items-center text-blue-600 font-semibold text-sm">
                        <span>Launch Platform</span>
                        <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>
                    </div>
                </div>

            </div>
        </div>

        <!-- IFRAME VIEWER SCREEN -->
        <div id="viewer-screen" class="screen flex-col w-full h-[84vh] max-w-7xl mx-auto">

            <div class="bg-white px-4 py-3 rounded-2xl shadow-sm border border-slate-200/80 mb-4 flex items-center justify-between">

                <button onclick="backToPlatform()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back</span>
                </button>

                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-xs font-semibold text-slate-700">Next Toppers Session</span>
                </div>

                <button onclick="refreshIframe()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-rotate"></i>
                    <span>Refresh</span>
                </button>

            </div>

            <div class="flex-1 w-full bg-white rounded-3xl shadow-sm border border-slate-200/80 overflow-hidden relative flex flex-col">
                <iframe
                    id="content-iframe"
                    src=""
                    class="w-full h-full border-0 flex-1"
                    allowfullscreen>
                </iframe>
            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="w-full py-4 text-center text-xs text-slate-400 border-t border-slate-100 bg-white/50">
        &copy; 2026 DIVJOTEDU. All rights reserved.
    </footer>

    <!-- ACCESS GATE SCRIPT -->
    <script>

        const VP_GATE_URL = "https://vplink.in/RbssV";

        const ACCESS_KEY = "divjotedu_access_expiry";

        const ACCESS_DURATION = 24 * 60 * 60 * 1000;


        function showScreen(screenId) {

            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });

            document.getElementById(screenId).classList.add('active');

            window.scrollTo(0, 0);
        }


        function goToWelcome() {
            showScreen('welcome-screen');
        }


        function handleStartStudying() {
            showScreen('platform-screen');
        }


        // CHECK 24-HOUR ACCESS
        function hasAccess() {

            try {

                const expiry = Number(localStorage.getItem(ACCESS_KEY));

                return Number.isFinite(expiry) && expiry > Date.now();

            } catch (error) {

                return false;

            }
        }


        // OPEN NEXT TOPPERS
        function launchNextToppers() {

            showScreen('viewer-screen');

            const iframe = document.getElementById('content-iframe');

            iframe.src = 'https://nt.studyace.in';
        }


        // ACCESS GATE
        function openNextToppers() {

            if (hasAccess()) {

                launchNextToppers();

                return;
            }

            try {

                sessionStorage.setItem('divjotedu_return_to_nt', '1');

            } catch (error) {}

            window.location.href = VP_GATE_URL;
        }


        // BACK BUTTON
        function backToPlatform() {

            const iframe = document.getElementById('content-iframe');

            iframe.src = '';

            showScreen('platform-screen');
        }


        // REFRESH BUTTON
        function refreshIframe() {

            const iframe = document.getElementById('content-iframe');

            iframe.src = iframe.src;
        }


        // HANDLE RETURN FROM KEYFREE
        window.addEventListener('DOMContentLoaded', function() {

            const params = new URLSearchParams(window.location.search);

            if (
                params.get('unlocked') === '1' &&
                hasAccess() &&
                sessionStorage.getItem('divjotedu_return_to_nt') === '1'
            ) {

                sessionStorage.removeItem('divjotedu_return_to_nt');

                history.replaceState({}, '', window.location.pathname);

                launchNextToppers();
            }

        });

    </script>

</body>
</html>
